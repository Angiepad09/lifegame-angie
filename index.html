<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeGame Angie - Tu Aventura Profesional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    },
                    animation: {
                        'float-up': 'floatUp 1s ease-out forwards',
                        'shake': 'shake 0.4s ease-in-out',
                        'bounce-slow': 'bounce 3s infinite',
                        'attack-l': 'attackLeft 0.3s ease-in-out',
                        'attack-r': 'attackRight 0.3s ease-in-out',
                    },
                    keyframes: {
                        floatUp: {
                            '0%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                            '100%': { opacity: '0', transform: 'translateY(-50px) scale(1.5)' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '25%': { transform: 'translateX(-8px)' },
                            '50%': { transform: 'translateX(8px)' },
                            '75%': { transform: 'translateX(-8px)' },
                        },
                        attackLeft: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '50%': { transform: 'translateX(30px) scale(1.1)' },
                        },
                        attackRight: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '50%': { transform: 'translateX(-30px) scale(1.1)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body {
            background-color: #020617;
            color: #cbd5e1;
            overflow-anchor: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        .pixel-corners {
            clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 font-mono antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const TerminalIcon = (props) => <i data-lucide="terminal" {...props}></i>;
        const UserIcon = (props) => <i data-lucide="user" {...props}></i>;
        const TargetIcon = (props) => <i data-lucide="target" {...props}></i>;
        const TrophyIcon = (props) => <i data-lucide="trophy" {...props}></i>;
        const SwordsIcon = (props) => <i data-lucide="swords" {...props}></i>;
        const ShieldIcon = (props) => <i data-lucide="shield" {...props}></i>;
        const BookOpenIcon = (props) => <i data-lucide="book-open" {...props}></i>;
        const BriefcaseIcon = (props) => <i data-lucide="briefcase" {...props}></i>;
        const DollarSignIcon = (props) => <i data-lucide="dollar-sign" {...props}></i>;
        const PlayCircleIcon = (props) => <i data-lucide="play-circle" {...props}></i>;
        const AlertTriangleIcon = (props) => <i data-lucide="alert-triangle" {...props}></i>;
        const GiftIcon = (props) => <i data-lucide="gift" {...props}></i>;
        const StarIcon = (props) => <i data-lucide="star" {...props}></i>;
        const CheckCircleIcon = (props) => <i data-lucide="check-circle" {...props}></i>;
        const XCircleIcon = (props) => <i data-lucide="x-circle" {...props}></i>;
        const GamepadIcon = (props) => <i data-lucide="gamepad-2" {...props}></i>;
        const AwardIcon = (props) => <i data-lucide="award" {...props}></i>;
        const BarChart2Icon = (props) => <i data-lucide="bar-chart-2" {...props}></i>;
        const FlameIcon = (props) => <i data-lucide="flame" {...props}></i>;
        const GhostIcon = (props) => <i data-lucide="ghost" {...props}></i>;
        const SmartphoneIcon = (props) => <i data-lucide="smartphone" {...props}></i>;
        const BugIcon = (props) => <i data-lucide="bug" {...props}></i>;
        const SkullIcon = (props) => <i data-lucide="skull" {...props}></i>;
        const ZapIcon = (props) => <i data-lucide="zap" {...props}></i>;
        const EyeOffIcon = (props) => <i data-lucide="eye-off" {...props}></i>;
        const HelpCircleIcon = (props) => <i data-lucide="help-circle" {...props}></i>;
        const CheckSquareIcon = (props) => <i data-lucide="check-square" {...props}></i>;
        const CpuIcon = (props) => <i data-lucide="cpu" {...props}></i>;

        // Limiter / Master Limiter node to prevent clipping when multiple sounds play at once
        let masterLimiter = null;
        const getMasterLimiter = () => {
            if (!masterLimiter && window.Tone) {
                masterLimiter = new Tone.Limiter(-1).toDestination();
            }
            return masterLimiter;
        };

        const sfx = {
            gainXp: () => {
                const limiter = getMasterLimiter();
                const synth = new Tone.Synth().connect(limiter || Tone.Destination);
                synth.volume.value = -14;
                synth.triggerAttackRelease("C5", "32n");
                setTimeout(() => synth.triggerAttackRelease("E5", "32n"), 100);
            },
            enemyAppear: () => {
                const limiter = getMasterLimiter();
                const synth = new Tone.MembraneSynth().connect(limiter || Tone.Destination);
                synth.volume.value = -8;
                synth.triggerAttackRelease("C2", "8n");
                setTimeout(() => synth.triggerAttackRelease("C1", "4n"), 150);
            },
            win: () => {
                const limiter = getMasterLimiter();
                const synth = new Tone.PolySynth(Tone.Synth).connect(limiter || Tone.Destination);
                synth.volume.value = -12;
                synth.triggerAttackRelease(["C4", "E4", "G4"], "8n");
                setTimeout(() => synth.triggerAttackRelease(["C5", "E5", "G5"], "4n"), 200);
            },
            lose: () => {
                const limiter = getMasterLimiter();
                const synth = new Tone.FMSynth().connect(limiter || Tone.Destination);
                synth.volume.value = -12;
                synth.triggerAttackRelease("D3", "8n");
                setTimeout(() => synth.triggerAttackRelease("A2", "4n"), 200);
            },
            levelUp: () => {
                const limiter = getMasterLimiter();
                const synth = new Tone.PolySynth(Tone.Synth).connect(limiter || Tone.Destination);
                synth.volume.value = -8;
                const now = Tone.now();
                synth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                synth.triggerAttackRelease(["E4", "G4", "B4"], "8n", now + 0.2);
                synth.triggerAttackRelease(["G4", "B4", "D5"], "8n", now + 0.4);
                synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "2n", now + 0.6);
            },
            achievement: () => {
                const limiter = getMasterLimiter();
                const synth = new Tone.Synth({ oscillator: { type: 'triangle' } }).connect(limiter || Tone.Destination);
                synth.volume.value = -10;
                const now = Tone.now();
                synth.triggerAttackRelease("G4", "16n", now);
                synth.triggerAttackRelease("B4", "16n", now + 0.1);
                synth.triggerAttackRelease("D5", "16n", now + 0.2);
                synth.triggerAttackRelease("G5", "8n", now + 0.3);
            }
        };

        const playSound = async (type) => {
            try {
                if (Tone.context.state !== 'running') {
                    await Tone.start();
                }
                if (sfx[type]) sfx[type]();
            } catch (e) {
                console.log("Audio play suppressed:", e);
            }
        };

        
        const TechTreeModal = ({ onClose, unlockedTechs, onUnlockTech, xp }) => {
            const techTree = [
                { id: 'python', name: 'Dominio de Python', cost: 100, desc: 'Bases de programación sólidas', icon: '🐍' },
                { id: 'git', name: 'Control Git & GitHub', cost: 250, desc: 'Manejo de versiones profesional', icon: '🐙' },
                { id: 'react', name: 'Desarrollo React.js', cost: 500, desc: 'Creación de interfaces web modernas', icon: '⚛️' },
                { id: 'backend', name: 'Backend & APIs', cost: 1000, desc: 'Conexión con servidores y BD', icon: '🗄️' },
                { id: 'fullstack', name: 'Arquitectura Fullstack', cost: 2000, desc: 'Dominio integral de desarrollo', icon: '🚀' },
            ];

            return (
                <div className="fixed inset-0 bg-slate-950/90 flex items-center justify-center z-[70] p-4 backdrop-blur-md font-mono">
                    <div className="bg-slate-900 border-4 border-purple-500 rounded-2xl p-6 shadow-[0_0_40px_rgba(168,85,247,0.3)] max-w-lg w-full relative">
                        <button onClick={onClose} className="absolute top-3 right-3 text-slate-400 hover:text-red-500 z-10">
                            <XCircleIcon className="w-6 h-6" />
                        </button>
                        
                        <div className="text-center mb-6">
                            <CpuIcon className="w-12 h-12 text-purple-400 mx-auto mb-2 animate-bounce-slow" />
                            <h2 className="text-xl font-black text-white uppercase tracking-widest">Árbol Tecnológico</h2>
                            <p className="text-xs text-slate-400">Desbloquea habilidades clave invirtiendo tu XP</p>
                        </div>

                        <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                            {techTree.map((tech) => {
                                const isUnlocked = unlockedTechs.includes(tech.id);
                                const canAfford = xp >= tech.cost;

                                return (
                                    <div key={tech.id} className={`p-4 rounded-xl border-2 flex items-center justify-between gap-4 transition-all ${
                                        isUnlocked ? 'bg-purple-950/30 border-purple-500/60 shadow-[0_0_15px_rgba(168,85,247,0.15)]' : 'bg-slate-950 border-slate-800'
                                    }`}>
                                        <div className="text-3xl shrink-0 bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                                            {tech.icon}
                                        </div>
                                        <div className="flex-1">
                                            <h3 className={`font-bold text-sm ${isUnlocked ? 'text-purple-300' : 'text-slate-300'}`}>
                                                {tech.name}
                                            </h3>
                                            <p className="text-xs text-slate-500 mt-0.5">{tech.desc}</p>
                                            <span className="text-[10px] text-yellow-400 font-bold">Costo: {tech.cost} XP</span>
                                        </div>
                                        <div>
                                            {isUnlocked ? (
                                                <span className="bg-purple-600 text-white text-[10px] font-black px-3 py-1.5 rounded-xl uppercase">
                                                    Adquirido
                                                </span>
                                            ) : (
                                                <button
                                                    onClick={() => onUnlockTech(tech.id, tech.cost)}
                                                    disabled={!canAfford}
                                                    className={`text-xs font-black px-4 py-2 rounded-xl transition-all ${
                                                        canAfford ? 'bg-yellow-500 hover:bg-yellow-400 text-slate-950 shadow-lg shadow-yellow-600/30 active:scale-95' : 'bg-slate-800 text-slate-600 cursor-not-allowed'
                                                    }`}
                                                >
                                                    Desbloquear
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const MiniGame = ({ onFinish, onClose }) => {
            const canvasRef = useRef(null);
            const [gameState, setGameState] = useState('start'); 
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(25);
            const [lives, setLives] = useState(3);
            
            const gameData = useRef({
                player: { x: 138, y: 138, size: 24, speed: 4.5, invulnerable: false },
                keys: {},
                items: [
                    { x: 40, y: 40, type: '💻' },
                    { x: 230, y: 50, type: '☕' },
                    { x: 60, y: 220, type: '💻' },
                    { x: 210, y: 210, type: '☕' }
                ],
                enemies: [
                    { x: 140, y: 40, baseDx: 2.8, baseDy: 2.2, dx: 2.8, dy: 2.2 },
                    { x: 60, y: 140, baseDx: -2.2, baseDy: 2.8, dx: -2.2, dy: 2.8 },
                    { x: 220, y: 180, baseDx: 2.5, baseDy: -2.5, dx: 2.5, dy: -2.5 }
                ],
                score: 0,
                lives: 3
            });

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                        e.preventDefault();
                    }
                    gameData.current.keys[e.key] = true;
                };

                const handleKeyUp = (e) => {
                    gameData.current.keys[e.key] = false;
                };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);

                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, []);

            useEffect(() => {
                let timer;
                if (gameState === 'playing' && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                setGameState('end');
                                return ;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [gameState, timeLeft]);

            const startGame = () => {
                gameData.current = {
                    player: { x: 138, y: 138, size: 24, speed: 4.5, invulnerable: false },
                    keys: {},
                    items: [
                        { x: 40, y: 40, type: '💻' },
                        { x: 230, y: 50, type: '☕' },
                        { x: 60, y: 220, type: '💻' },
                        { x: 210, y: 210, type: '☕' }
                    ],
                    enemies: [
                        { x: 140, y: 40, baseDx: 2.8, baseDy: 2.2, dx: 2.8, dy: 2.2 },
                        { x: 60, y: 140, baseDx: -2.2, baseDy: 2.8, dx: -2.2, dy: 2.8 },
                        { x: 220, y: 180, baseDx: 2.5, baseDy: -2.5, dx: 2.5, dy: -2.5 }
                    ],
                    score: 0,
                    lives: 3
                };
                setScore(0);
                setLives(3);
                setTimeLeft(25);
                setGameState('playing');
            };

            const setKey = (code, isDown) => () => {
                gameData.current.keys[code] = isDown;
            };

            useEffect(() => {
                if (gameState !== 'playing') return;

                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let reqId;

                const update = () => {
                    if (gameState !== 'playing') return;
                    const data = gameData.current;
                    const p = data.player;
                    const keys = data.keys;

                    if (keys['ArrowUp'] || keys['w'] || keys['W']) p.y -= p.speed;
                    if (keys['ArrowDown'] || keys['s'] || keys['S']) p.y += p.speed;
                    if (keys['ArrowLeft'] || keys['a'] || keys['A']) p.x -= p.speed;
                    if (keys['ArrowRight'] || keys['d'] || keys['D']) p.x += p.speed;

                    p.x = Math.max(0, Math.min(276, p.x));
                    p.y = Math.max(0, Math.min(276, p.y));

                    const timeElapsed = 25 - timeLeft;
                    const speedMultiplier = 1.2 + (timeElapsed * 0.08); 

                    data.enemies.forEach(e => {
                        e.dx = (e.baseDx >= 0 ? 1 : -1) * (Math.abs(e.baseDx) * speedMultiplier);
                        e.dy = (e.baseDy >= 0 ? 1 : -1) * (Math.abs(e.baseDy) * speedMultiplier);

                        e.x += e.dx;
                        e.y += e.dy;
                        if (e.x <= 0 || e.x >= 276) e.baseDx *= -1;
                        if (e.y <= 0 || e.y >= 276) e.baseDy *= -1;
                    });

                    if (!p.invulnerable) {
                        data.items.forEach((item) => {
                            const dx = p.x - item.x;
                            const dy = p.y - item.y;
                            if (Math.sqrt(dx*dx + dy*dy) < 24) {
                                data.score += 5;
                                setScore(data.score);
                                playSound('gainXp');
                                
                                item.x = Math.random() * 240;
                                item.y = Math.random() * 240;
                            }
                        });

                        data.enemies.forEach(enemy => {
                            const dx = p.x - enemy.x;
                            const dy = p.y - enemy.y;
                            if (Math.sqrt(dx*dx + dy*dy) < 22) {
                                data.lives -= 1;
                                setLives(data.lives);
                                data.score = Math.max(0, data.score - 5);
                                setScore(data.score);
                                playSound('lose');
                                
                                if (data.lives <= 0) {
                                    setLives(0);
                                    setGameState('end');
                                    return;
                                } else {
                                    p.invulnerable = true;
                                    setTimeout(() => { if(gameData.current) gameData.current.player.invulnerable = false; }, 1500);
                                }
                            }
                        });
                    }
                };

                const draw = () => {
                    if (!ctx) return;
                    ctx.clearRect(0, 0, 300, 300);
                    const data = gameData.current;
                    
                    ctx.font = "24px Arial";
                    ctx.textAlign = "left";
                    ctx.textBaseline = "top";
                    
                    data.items.forEach(item => ctx.fillText(item.type, item.x, item.y));
                    data.enemies.forEach(e => ctx.fillText("🐛", e.x, e.y));
                    
                    ctx.globalAlpha = data.player.invulnerable ? 0.3 : 1;
                    ctx.fillText("👩‍💻", data.player.x, data.player.y);
                    ctx.globalAlpha = 1;
                };

                const loop = () => {
                    if (gameState === 'playing') {
                        update();
                        draw();
                        reqId = requestAnimationFrame(loop);
                    }
                };

                reqId = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(reqId);
            }, [gameState, timeLeft]);

            const finalCalculatedXp = Math.min(100, Math.floor(score * 0.8));

            return (
                <div className="fixed inset-0 bg-slate-950/90 flex flex-col items-center justify-center z-[70] p-4 backdrop-blur-md font-mono">
                    <div className="bg-slate-900 border-4 border-indigo-500 rounded-2xl p-4 sm:p-6 shadow-[0_0_40px_rgba(99,102,241,0.3)] max-w-sm w-full relative">
                        <button onClick={onClose} className="absolute top-2 right-2 text-slate-400 hover:text-red-500 z-10">
                            <XCircleIcon className="w-6 h-6" />
                        </button>
                        
                        <div className="text-center mb-4">
                            <h2 className="text-xl font-black text-indigo-400 uppercase tracking-widest">Bug Hunter Arcade</h2>
                            <p className="text-[11px] text-slate-400 mt-1">Atrapa código y café. (Conversión: 80% a XP balanceada)</p>
                            {gameState === 'playing' && (
                                <div className="flex justify-between items-center mt-2 font-bold px-2">
                                    <span className="text-yellow-400 text-base">Puntos: {score}</span>
                                    <div className="text-red-500 text-base tracking-widest" title="Vidas">
                                        {'❤️'.repeat(lives)}{'🖤'.repeat(3 - lives)}
                                    </div>
                                    <span className={`text-base ${timeLeft <= 5 ? "text-red-500 animate-pulse" : "text-emerald-400"}`}>
                                        ⏳ {timeLeft}s
                                    </span>
                                </div>
                            )}
                        </div>

                        <div className="bg-slate-950 rounded-xl overflow-hidden border-2 border-slate-700 flex justify-center relative touch-none mx-auto w-[300px] h-[300px] shadow-inner">
                            {gameState === 'start' && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 z-10 p-6 text-center">
                                    <GamepadIcon className="w-16 h-16 text-indigo-400 mb-4 animate-bounce-slow" />
                                    <p className="text-xs text-slate-300 mb-6 font-bold leading-relaxed">
                                        Atrapa objetos (💻☕) esquivando bugs.<br/>
                                        <span className="text-indigo-300">¡Economía balanceada para evitar inflación de XP!</span>
                                    </p>
                                    <button onClick={startGame} className="bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 px-8 rounded-xl active:scale-95 shadow-lg shadow-indigo-900/50 uppercase tracking-widest transition-all">
                                        ¡START!
                                    </button>
                                </div>
                            )}
                            
                            {gameState === 'end' && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/95 z-10 p-6 text-center">
                                    <TrophyIcon className="w-16 h-16 text-yellow-400 mb-3 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)]" />
                                    <h3 className="text-2xl font-black text-white mb-1 tracking-widest">
                                        {lives <= 0 ? '¡GAME OVER!' : '¡TIEMPO AGOTADO!'}
                                    </h3>
                                    <p className="text-slate-400 text-xs mb-3">Puntuación: {score} pts</p>
                                    <p className="text-yellow-400 font-bold mb-6 bg-slate-950 px-4 py-2 rounded-lg border border-yellow-900/50 text-base">
                                        XP Reclamable: +{finalCalculatedXp} XP
                                    </p>
                                    <button onClick={() => onFinish(finalCalculatedXp)} className="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black py-3 px-6 rounded-xl active:scale-95 w-full uppercase shadow-lg shadow-yellow-700/50">
                                        Reclamar XP
                                    </button>
                                </div>
                            )}

                            <canvas 
                                ref={canvasRef} 
                                width="300" 
                                height="300" 
                                className="block bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+CjxyZWN0IHdpZHRoPSIyMCIgaGVpZ2h0PSIyMciIGZpbGw9IjBmMTEyMSIvPgo8Y2lyY2xlIGN4PSIxMCIgY3k9IjEwIiByPSIxIiBmaWxsPSIjM2IzZDRjIi8+Cjwvc3ZnPg==')] opacity-90"
                            ></canvas>
                        </div>
                        
                        {gameState === 'playing' && (
                            <div className="mt-4 grid grid-cols-3 gap-2 max-w-[180px] mx-auto opacity-90 lg:hidden">
                                <div></div>
                                <button 
                                    onPointerDown={setKey('ArrowUp', true)} onPointerUp={setKey('ArrowUp', false)} onPointerLeave={setKey('ArrowUp', false)}
                                    className="bg-slate-800 p-3 rounded-xl active:bg-indigo-600 flex justify-center text-white select-none"
                                >▲</button>
                                <div></div>
                                <button 
                                    onPointerDown={setKey('ArrowLeft', true)} onPointerUp={setKey('ArrowLeft', false)} onPointerLeave={setKey('ArrowLeft', false)}

                    ...prev,

                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    ...prev,
                    missionsCompleted: amount > 0 ? prev.missionsCompleted + 1 : prev.missionsCompleted,

                                                    <span className={`text-[9px] font-black px-1.5 py-0.5 rounded shrink-0 ${inv.type === 'GRANDE' ? 'bg-amber-600 text-white' : 'bg-amber-900 text-amber-400'}`}>
                                                        {inv.type}
                                                    </span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}
                            </section>
                            
                            <section className="bg-black border-2 border-slate-700 rounded-xl overflow-hidden flex flex-col h-72 shadow-lg">
                                <div className="bg-slate-800 border-b-2 border-slate-700 p-3 flex items-center justify-between">
                                    <span className="text-xs text-slate-400 font-bold flex items-center gap-2">
                                        <TerminalIcon className="w-4 h-4" /> BATTLE_LOG.txt
                                    </span>
                                </div>
                                <div className="p-4 flex-1 overflow-y-auto space-y-2 text-xs font-mono">
                                    {log.length === 0 ? (
                                        <div className="text-slate-600 italic">Esperando acciones...</div>
                                    ) : (
                                        log.map(entry => (
                                            <div key={entry.id} className={`border-l-2 pl-2 ${
                                                entry.type === 'levelup' ? 'border-yellow-400 text-yellow-400 font-bold' : 
                                                entry.type === 'achievement' ? 'border-amber-400 text-amber-300 font-bold' :
                                                entry.type === 'danger' ? 'border-red-500 text-red-400' : 
                                                entry.type === 'success' ? 'border-indigo-400 text-indigo-400 font-bold' : 
                                                'border-emerald-500 text-emerald-400'
                                            }`}>
                                                <span className="text-slate-600 opacity-70">[{entry.time}]</span> {entry.text}
                                            </div>
                                        ))
                                    )}
                                    <div ref={logEndRef} />
                                </div>
                            </section>
                        </div>
                    </main>

                    {showStatsModal && (
                        <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-slate-900 border-4 border-indigo-500 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                                <button onClick={() => setShowStatsModal(false)} className="absolute top-3 right-3 text-slate-400 hover:text-red-500">
                                    <XCircleIcon className="w-6 h-6" />
                                </button>
                                <div className="text-center mb-6">
                                    <BarChart2Icon className="w-12 h-12 text-indigo-400 mx-auto mb-2" />
                                    <h2 className="text-xl font-black text-white uppercase tracking-widest">Estadísticas Personales</h2>
                                    <p className="text-xs text-slate-400">Resumen de tu rendimiento como Desarrolladora</p>
                                </div>
                                <div className="space-y-3 font-semibold text-sm">
                                    <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <span className="text-slate-400">Misiones completadas:</span>
                                        <span className="text-emerald-400 font-bold text-base">{stats.missionsCompleted}</span>
                                    </div>
                                    <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <span className="text-slate-400">Jefes / Bugs derrotados:</span>
                                        <span className="text-red-400 font-bold text-base">{stats.bossesDefeated}</span>
                                    </div>
                                    <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <span className="text-slate-400">Minijuegos jugados:</span>
                                        <span className="text-indigo-400 font-bold text-base">{stats.minigamesPlayed}</span>
                                    </div>
                                    <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <span className="text-slate-400">XP Total acumulada:</span>
                                        <span className="text-yellow-400 font-bold text-base">{stats.totalXpEarned} XP</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAchievementsModal && (
                        <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-slate-900 border-4 border-amber-500 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[85vh] flex flex-col">
                                <button onClick={() => setShowAchievementsModal(false)} className="absolute top-3 right-3 text-slate-400 hover:text-red-500 z-10">
                                    <XCircleIcon className="w-6 h-6" />
                                </button>
                                <div className="text-center mb-6">
                                    <AwardIcon className="w-12 h-12 text-amber-400 mx-auto mb-2" />
                                    <h2 className="text-xl font-black text-white uppercase tracking-widest">Sistema de Logros</h2>
                                    <p className="text-xs text-slate-400">Desbloquea hitos completando objetivos clave</p>
                                </div>
                                <div className="space-y-3 overflow-y-auto pr-1 flex-1">
                                    {achievementsList.map((ach) => {
                                        const isUnlocked = unlockedAchievements.includes(ach.id);
                                        return (
                                            <div key={ach.id} className={`p-3.5 rounded-xl border-2 flex items-center gap-4 transition-all ${
                                                isUnlocked ? 'bg-amber-950/20 border-amber-500/60 shadow-[0_0_15px_rgba(245,158,11,0.15)]' : 'bg-slate-950 border-slate-800 opacity-60'
                                            }`}>
                                                <div className="text-3xl shrink-0 bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                                                    {ach.icon}
                                                </div>
                                                <div className="flex-1">
                                                    <h3 className={`font-bold text-sm ${isUnlocked ? 'text-amber-300' : 'text-slate-400'}`}>
                                                        {ach.title}
                                                    </h3>
                                                    <p className="text-xs text-slate-500 mt-0.5">{ach.desc}</p>
                                                </div>
                                                <div>
                                                    {isUnlocked ? (
                                                        <span className="bg-amber-500 text-slate-950 text-[10px] font-black px-2.5 py-1 rounded-full uppercase">
                                                            ¡Logrado!
                                                        </span>
                                                    ) : (
                                                        <span className="bg-slate-900 text-slate-600 text-[10px] font-bold px-2.5 py-1 rounded-full">
                                                            Bloqueado
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeEnemy && (
                        <div className="fixed inset-0 bg-slate-950/90 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-slate-900 border-4 border-red-500 rounded-2xl max-w-xl w-full p-6 sm:p-8 shadow-[0_0_60px_rgba(239,68,68,0.3)]">
                                <div className="text-center mb-6">
                                    <h2 className="text-2xl sm:text-3xl font-black text-red-500 uppercase tracking-widest mb-1 animate-pulse">
                                        ⚠️ ¡ENCUENTRO CON JEFE!
                                    </h2>
                                    <p className="text-slate-400 text-xs bg-slate-950 inline-block px-4 py-1.5 rounded-full border border-slate-800">
                                        Misión en riesgo: {pendingAction.desc}
                                    </p>
                                </div>

                                <div className="flex justify-between items-center mb-6 bg-slate-950 p-5 rounded-xl border-2 border-slate-800">
                                    <div className="text-center w-1/3 flex flex-col items-center">
                                        <div className="bg-indigo-900/50 p-3 rounded-full border border-indigo-500 mb-2">
                                            <UserIcon className="w-10 h-10 text-indigo-400" />
                                        </div>
                                        <div className="font-bold text-indigo-400 text-xs">ANGIE</div>
                                    </div>

                                    <div className="w-1/3 text-center">
                                        <div className="text-3xl font-black text-slate-600 italic">VS</div>
                                    </div>

                                    <div className="text-center w-1/3 flex flex-col items-center">
                                        <div className="text-red-500 mb-2 animate-bounce-slow drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">
                                            {activeEnemy.icon}
                                        </div>
                                        <div className="font-black text-red-400 text-xs truncate max-w-full">
                                            {activeEnemy.name}
                                        </div>
                                        <div className="text-[10px] text-red-500/70 mt-0.5">Amenaza: {activeEnemy.threat}</div>
                                    </div>
                                </div>
                                
                                <div className="bg-slate-800/80 p-4 rounded-xl border-2 border-slate-700">
                                    <h3 className="text-xs font-black text-white mb-3 flex items-center gap-2">
                                        <SwordsIcon className="w-4 h-4"/> ¿QUÉ ESTRATEGIA DEBES USAR?
                                    </h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                        {[
                                            activeEnemy.weakness,
                                            ...allTools.filter(t => t !== activeEnemy.weakness).sort(() => 0.5 - Math.random()).slice(0, 3)
                                        ].sort(() => 0.5 - Math.random()).map((tool, i) => (
                                            <button
                                                key={i}
                                                onClick={() => handleDefense(tool)}
                                                className="w-full p-3 bg-slate-950 border border-slate-700 rounded-xl hover:bg-slate-700 hover:border-indigo-400 transition-all text-xs font-bold text-left flex items-center gap-2.5 active:scale-95"
                                            >
                                                <ShieldIcon className="w-4 h-4 text-indigo-400 shrink-0" />
                                                <span className="whitespace-normal break-words">{tool}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {battleResult && (
                        <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4 backdrop-blur-md">
                            <div className={`bg-slate-900 border-4 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl ${battleResult.type === 'win' ? 'border-emerald-500 shadow-[0_0_60px_rgba(16,185,129,0.3)]' : 'border-red-500 shadow-[0_0_60px_rgba(239,68,68,0.3)]'}`}>
                                {battleResult.type === 'win' ? (
                                    <CheckCircleIcon className="w-20 h-20 text-emerald-400 mx-auto mb-3 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]" />
                                ) : (
                                    <XCircleIcon className="w-20 h-20 text-red-500 mx-auto mb-3 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]" />
                                )}
                                <h2 className={`text-xl font-black uppercase tracking-wider mb-2 ${battleResult.type === 'win' ? 'text-emerald-400' : 'text-red-500'}`}>
                                    {battleResult.title}
                                </h2>
                                <p className="text-slate-300 text-xs font-semibold mb-6 bg-slate-950 p-3.5 rounded-xl border border-slate-800 leading-relaxed">
                                    {battleResult.message}
                                </p>
                                <button 
                                    onClick={() => setBattleResult(null)}
                                    className={`w-full font-black py-3.5 px-4 rounded-xl transition-transform active:scale-95 uppercase tracking-widest text-white shadow-lg ${battleResult.type === 'win' ? 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-900/50' : 'bg-red-600 hover:bg-red-500 shadow-red-900/50'}`}
                                >
                                    Continuar
                                </button>
                            </div>
                        </div>
                    )}

                    {achievementNotice && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-md">
                            <div className="bg-slate-900 border-4 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center shadow-[0_0_80px_rgba(250,204,21,0.4)]">
                                <div className="text-5xl mb-3 animate-bounce">{achievementNotice.icon}</div>
                                <span className="text-[10px] bg-amber-950 text-amber-400 font-black px-3 py-1 rounded-full uppercase border border-amber-700">¡Logro Desbloqueado!</span>
                                <h2 className="text-2xl font-black text-white mt-2 mb-1 tracking-wider">{achievementNotice.title}</h2>
                                <p className="text-slate-400 text-xs mb-6 bg-slate-950 p-3 rounded-xl border border-amber-900/50">{achievementNotice.desc}</p>
                                <button 
                                    onClick={() => setAchievementNotice(null)}
                                    className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 px-4 rounded-xl active:scale-95 uppercase tracking-widest shadow-lg shadow-amber-600/50"
                                >
                                    ¡Excelente!
                                </button>
                            </div>
                        </div>
                    )}

                    {levelUpNotice && (
                        <div className="fixed inset-0 bg-amber-950/90 flex items-center justify-center z-50 p-4 backdrop-blur-md">
                            <div className="bg-slate-900 border-4 border-yellow-400 rounded-3xl max-w-md w-full p-8 text-center shadow-[0_0_100px_rgba(250,204,21,0.4)]">
                                <StarIcon className="w-24 h-24 text-yellow-400 mx-auto mb-4 drop-shadow-[0_0_20px_rgba(250,204,21,0.8)] animate-pulse" />
                                <h2 className="text-3xl font-black text-yellow-400 uppercase tracking-widest mb-2">¡LEVEL UP!</h2>
                                <div className="bg-yellow-950/50 border-2 border-yellow-500/50 p-4 rounded-xl mb-6">
                                    <p className="text-xs text-yellow-500 font-bold mb-1">NUEVO NIVEL ALCANZADO</p>
                                    <p className="text-xl font-black text-white">Nivel {levelUpNotice.id}: {levelUpNotice.title}</p>
                                </div>
                                <button 
                                    onClick={() => setLevelUpNotice(null)}
                                    className="w-full bg-gradient-to-r from-yellow-500 to-yellow-400 hover:from-yellow-400 hover:to-yellow-300 text-slate-950 font-black py-3.5 px-4 rounded-xl active:scale-95 uppercase tracking-widest shadow-lg shadow-yellow-600/50"
                                >
                                    ¡Aceptar Nuevo Nivel!
                                </button>
                            </div>
                        </div>
                    )}

                    {rewardNotice && (
                        <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-slate-900 border-4 border-emerald-500 rounded-2xl max-w-sm w-full p-6 text-center shadow-[0_0_50px_rgba(16,185,129,0.2)]">
                                <GiftIcon className="w-16 h-16 text-emerald-400 mx-auto mb-3 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)] animate-bounce" />
                                <h2 className="text-xl font-black text-emerald-400 uppercase tracking-widest mb-1">¡LOOT ENCONTRADO!</h2>
                                <p className="text-emerald-500 font-bold text-[11px] mb-3 uppercase">Recompensa {rewardNotice.type}</p>
                                <p className="text-white font-semibold text-sm mb-6 bg-slate-950 p-3.5 rounded-xl border border-emerald-900/50">
                                    {rewardNotice.text}
                                </p>
                                <button 
                                    onClick={() => setRewardNotice(null)}
                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 px-4 rounded-xl active:scale-95 shadow-lg shadow-emerald-900/50 uppercase tracking-widest text-xs"
                                >
                                    Reclamar
                                </button>
                            </div>
                        </div>
                    )}

                    {showMinigame && (
                        <MiniGame 
                            onClose={() => setShowMinigame(false)} 
                            onFinish={(gainedXp) => {
                                setShowMinigame(false);
                                if(gainedXp > 0) {
                                    processAction(gainedXp, `🎮 ¡Sesión Arcade! +${gainedXp} XP reclamados.`, true);
                                    playSound('win');
                                }
                            }} 
                        />
                    )}

                    {showTechTreeModal && (
                        <TechTreeModal 
                            onClose={() => setShowTechTreeModal(false)}
                            unlockedTechs={unlockedTechs}
                            xp={xp}
                            onUnlockTech={(techId, cost) => {
                                if (xp >= cost) {
                                    setXp(prev => prev - cost);
                                    setUnlockedTechs(prev => [...prev, techId]);
                                    playSound('achievement');
                                    setLog(prev => [...prev, {
                                        id: `${Date.now()}-${Math.random()}`,
                                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                        text: `🧠 ¡Habilidad desbloqueada en el Árbol Tech! (-${cost} XP)`,
                                        type: 'success'
                                    }]);
                                }
                            }}
                        />
                    )}
                    {gameCompleted && (
                        <div className="fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-6">
                            <div className="max-w-xl text-center">
                                <div className="text-7xl mb-6">🏆</div>
                                <h1 className="text-5xl font-black text-yellow-400 mb-6">LIFEGAME COMPLETADO</h1>
                                <p className="text-white text-lg mb-4">Has derrotado al Jefe Supremo:</p>
                                <p className="text-red-400 text-2xl font-black mb-8">☠️ Rendirme</p>
                                <div className="bg-slate-900 border border-yellow-500 rounded-2xl p-6 mb-6">
                                <p className="text-slate-200 mb-4">No llegaste hasta aquí por suerte.</p>
                                <p className="text-slate-200 mb-4">Lo lograste porque seguiste avanzando incluso cuando aparecieron obstáculos.</p>
                                <p className="text-yellow-400 font-bold">La meta nunca fue llegar al Nivel 5.</p>
                                <p className="text-yellow-400 font-bold">La meta fue convertirte en la persona capaz de alcanzarlo.</p>

                            </div>
                            <div className="text-slate-400 text-sm">XP Final: {xp}</div>
                            </div>
                        </div>)}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
